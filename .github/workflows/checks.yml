name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the secret scan sees every tracked file, not a
          # shallow slice of the branch tip.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Cheapest and highest-value first: a leaked credential should fail the
      # run before anything slower gets a chance to.
      - name: Secret scan
        run: npm run scan:secrets

      # Every server client is service-role, so RLS never fires and isolation
      # depends on each query carrying its own user_id filter.
      - name: Tenant scoping audit
        run: npm run audit:tenant

      # Non-blocking for now: `tsc --noEmit` already reports pre-existing
      # errors in lib/drive-inbox.ts, lib/ingestion.ts and lib/webhook.ts.
      # Flip this to blocking once those are cleared, so the check means
      # something instead of being permanently red.
      - name: Type check
        run: npm run type-check
        continue-on-error: true
